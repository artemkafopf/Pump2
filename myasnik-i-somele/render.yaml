databases:
  - name: mis-postgres
    databaseName: mis_db
    user: mis_user
    plan: free

services:
  - type: web
    name: mis-backend
    env: docker
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mis-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mis-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://mis-frontend.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://mis-frontend.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Хозяин
      - key: PAYMENT_RECIPIENT_NAME
        sync: false
      - key: PAYMENT_PHONE
        sync: false
      - key: PAYMENT_BANK_NAME
        sync: false
      - key: PAYMENT_NOTE_PREFIX
        value: Оплата мероприятия
      - key: SEED_SAMPLE_DATA
        value: true

  - type: static
    name: mis-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mis-backend.onrender.com/api
